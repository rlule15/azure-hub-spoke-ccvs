name: Infrastructure Deploy Workflow

# What will trigger this workflow
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write # Required for OIDC authentication with Azure
      contents: read
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check | if [ $? -ne 0 ]; then
            echo "Terraform files are not formatted correctly. Please run 'terraform fmt' to format them."
            exit 1
          fi

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_public_ssh_key: ${{ vars.ACTIONS_PUBLIC_SSH }}
          TF_VAR_resource_group_name: ${{ vars.RG_NAME }}

      - name: Terraform
        working-directory: terraform
        run: terraform apply --auto-approve
        env:
          TF_VAR_public_ssh_key: ${{ vars.ACTIONS_PUBLIC_SSH }}
          TF_VAR_resource_group_name: ${{ vars.RG_NAME }}