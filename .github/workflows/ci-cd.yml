name: CI/CD Workflow

# What will trigger this workflow
on:
  - workflow_dispatch

# Steps to run in this workflow
jobs:
  build:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read # to clone the repo
      packages: write # to push to GHCR
      security-events: write # to upload security scan results
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@master
        with:
          dockerfile: "Dockerfile"
          format: "sarif"
          output-file: "hadolint-results.sarif"

      - name: Upload Hadolint scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Ensure that the upload step runs even if the linting fails
        with:
          sarif_file: "hadolint-results.sarif"

      - name: Run Trivy to scan Dockerfile for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          severity: "CRITICAL,HIGH,MEDIUM"
          scan-ref: "Dockerfile"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Ensure that the upload step runs even if the scan fails
        with:
          sarif_file: "trivy-results.sarif"

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker Build Checks
        run: docker build --check .

      - name: Get Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ vars.IMAGE_VERSION }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
