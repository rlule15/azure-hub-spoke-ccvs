name: CI/CD Workflow

# What will trigger this workflow
on:
  - workflow_dispatch

# Steps to run in this workflow
jobs:
  lint_and_scan:
    name: Lint and Scan Dockerfile
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read # to clone the repo
      security-events: write # to upload security scan results

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@master
        with:
          dockerfile: "Dockerfile"
          format: "sarif"
          output-file: "hadolint-results.sarif"

      - name: Upload Hadolint scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Ensure that the upload step runs even if the linting fails
        with:
          sarif_file: "hadolint-results.sarif"

      - name: Scan Dockerfile for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          severity: "CRITICAL,HIGH,MEDIUM"
          scan-ref: "Dockerfile"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Ensure that the upload step runs even if the scan fails
        with:
          sarif_file: "trivy-results.sarif"

  build_and_test:
    name: Build, Scan, & Test Docker Image
    needs: lint_and_scan
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read # to clone the repo
      security-events: write # to upload security scan results
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker Build Checks
        run: docker build --check .

      - name: Build Local Image for Testing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}:test

      - name: Scan Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "ghcr.io/${{ github.repository }}:test"
          severity: "CRITICAL,HIGH,MEDIUM"
          format: "sarif"
          ignore-unfixed: true
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Ensure that the upload step runs even if the scan fails
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Container & Verify Health
        run: |
          sudo apt-get update && apt-get install -y curl
          docker run -d --name test-container ghcr.io/${{ github.repository }}:test
          sleep 5 # Wait for the container to start
          docker exec test-container curl -f http://localhost:8080/health
          docker stop test-container
          docker rm test-container

  push:
    name: Build, & push docker image to Github Container Registry
    needs: [lint_and_scan, build_and_test]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read # to clone the repo
      packages: write # to push to GHCR

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ vars.IMAGE_VERSION }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
