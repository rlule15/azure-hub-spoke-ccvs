name: Container CD Workflow

on:
  workflow_dispatch:

jobs:
  setup_nat_rules:
    name: Setup NAT Rules on Proxy Server
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: SSH into proxy server and setup NAT rules.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HUB_VM_PIP }}
          username: ${{ secrets.HUB_VM_USERNAME }}
          key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          port: ${{ secrets.PROXY_PORT }}
          script: |
            # Enable IP forwarding
            sudo sysctl -w net.ipv4.ip_forward=1

            
            # Allow spoke traffic to be forwarded out through the hub
            sudo iptables -A FORWARD \
              -s ${{ secrets.SPOKE_SUBNET }} -i eth0 -o eth0 \
              -j ACCEPT

            # Allow replies to established connections back to the spoke
            sudo iptables -A FORWARD \
              -d ${{ secrets.SPOKE_SUBNET }} -i eth0 -o eth0 \
              -m conntrack --ctstate ESTABLISHED,RELATED \
              -j ACCEPT

            # Translate spoke source addresses for outbound internet access
            sudo iptables -t nat -A POSTROUTING \
              -s ${{ secrets.SPOKE_SUBNET }} -o eth0 \
              -j MASQUERADE

            # Allow incoming traffic on port 8080 to be forwarded to the spoke
            sudo iptables -A FORWARD \
            -i eth0 -o eth0 -p tcp -d ${{ secrets.SPOKE_VM_IP }} --dport 8080 \
            -j ACCEPT

            # Forward incoming API requests to the spoke
            sudo iptables -t nat -A PREROUTING \
            -i eth0 -p tcp --dport 8080 \
            -j DNAT --to-destination ${{ secrets.SPOKE_VM_IP }}:8080

            # Translate incoming client traffic so the spoke replies through the hub
            sudo iptables -t nat -A POSTROUTING \
              -o eth0 -p tcp -d ${{ secrets.SPOKE_VM_IP }} --dport 8080 \
              -j SNAT --to-source ${{ secrets.HUB_SUBNET }}

  pull_and_deploy:
    name: Pull Docker Image from GitHub Container Registry and Deploy to Azure VM
    needs: setup_nat_rules
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read

    steps:
      - name: SSH into host, install Docker, pull image and run container.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SPOKE_VM_IP }}
          username: ${{ secrets.SPOKE_VM_USERNAME }}
          key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          port: ${{ secrets.PORT }}
          proxy_host: ${{ secrets.HUB_VM_PIP }}
          proxy_username: ${{ secrets.HUB_VM_USERNAME }}
          proxy_key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          script: |
            # Add Docker's official GPG key:
            set -e
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc

            # Add the repository to Apt sources:
            sudo tee /etc/apt/sources.list.d/docker.sources <<EOF
            Types: deb
            URIs: https://download.docker.com/linux/ubuntu
            Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
            Components: stable
            Architectures: $(dpkg --print-architecture)
            Signed-By: /etc/apt/keyrings/docker.asc
            EOF

            sudo apt-get update

            sudo apt-get install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

            # Log in to GitHub Container Registry
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker pull ghcr.io/${{ github.repository }}:latest

            sudo docker run -d -p 8080:8000 --name ccvs-api ghcr.io/${{ github.repository }}:latest