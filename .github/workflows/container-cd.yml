name: Container CD Workflow

on:
  workflow_dispatch:

jobs:
  pull_and_deploy:
    name: Pull Docker Image from GitHub Container Registry and Deploy to Azure VM
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: SSH into proxy server and setup NAT rules.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROXY_HOST }}
          username: ${{ secrets.PROXY_USERNAME }}
          key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          port: ${{ secrets.PROXY_PORT }}
          script: |

            # Allow spoke traffic to be forwarded out through the hub
            sudo iptables -A FORWARD \
              -s ${{ secrets.HUB_SUBNET }} -i eth0 -o eth0 \
              -j ACCEPT

            # Allow replies to established connections back to the spoke
            sudo iptables -A FORWARD \
              -d ${{ secrets.SPOKE_SUBNET }} -i eth0 -o eth0 \
              -m conntrack --ctstate ESTABLISHED,RELATED \
              -j ACCEPT

            # Translate spoke source addresses for outbound internet access
            sudo iptables -t nat -A POSTROUTING \
              -s ${{ secrets.HUB_SUBNET }} -o eth0 \
              -j MASQUERADE



      - name: SSH into host, install Docker, pull image and run container.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          port: ${{ secrets.PORT }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USERNAME }}
          proxy_key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          script: |
            # Add Docker's official GPG key:
            sudo apt update
            sudo apt install ca-certificates curl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc

            # Add the repository to Apt sources:
            sudo tee /etc/apt/sources.list.d/docker.sources <<EOF
            Types: deb
            URIs: https://download.docker.com/linux/ubuntu
            Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
            Components: stable
            Architectures: $(dpkg --print-architecture)
            Signed-By: /etc/apt/keyrings/docker.asc
            EOF

            sudo apt update

            sudo apt install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/rlule15/azure-hub-spoke-ccvs:latest

            docker run -d -p 8080:8000 --name ccvs-api ghcr.io/rlule15/azure-hub-spoke-ccvs:latest