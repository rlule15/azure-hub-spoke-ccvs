name: Container CD Workflow

on:
  workflow_dispatch:

jobs:
  pull_and_deploy:
    name: Pull Docker Image from GitHub Container Registry and Deploy to Azure VM
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download Docker dependencies, image and upload to vm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROXY_HOST }}
          username: ${{ secrets.PROXY_USERNAME }}
          key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          port: ${{ secrets.PROXY_PORT }}
          script: |

            # Add Docker's official GPG key:
            sudo apt update
            sudo apt install ca-certificates curl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc

            # Add the repository to Apt sources:
            sudo tee /etc/apt/sources.list.d/docker.sources <<EOF
            Types: deb
            URIs: https://download.docker.com/linux/ubuntu
            Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
            Components: stable
            Architectures: $(dpkg --print-architecture)
            Signed-By: /etc/apt/keyrings/docker.asc
            EOF

            sudo apt update

            sudo apt install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

            mkdir ~/docker-deps && cd docker-deps
            sudo apt-get update
            sudo apt-get download containerd.io docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin

            docker pull ghcr.io/rlule15/azure-hub-spoke-ccvs:latest
            docker save ghcr.io/rlule15/azure-hub-spoke-ccvs:latest -o azure-hub-spoke-ccvs.tar
  
        
            scp docker-deps/* ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/docker-deps
            scp azure-hub-spoke-ccvs.tar ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/azure-hub-spoke-ccvs.tar



      - name: SSH proxy command
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          port: ${{ secrets.PORT }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_username: ${{ secrets.PROXY_USERNAME }}
          proxy_key: ${{ secrets.ACTIONS_PRIVATE_SSH }}
          proxy_port: ${{ secrets.PROXY_PORT }}
          script: |
            mkdir abc/def
            ls -al